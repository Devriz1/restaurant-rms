<div class="report-toolbar">

<form method="get">

    <input type="hidden" name="range" id="rangeInput" value="{{ request.GET.range|default:'today' }}">

    <div class="quick-filters">

        <button type="button" class="quick-btn {% if request.GET.range == 'today' or not request.GET.range %}active{% endif %}" data-range="today">
            Today
        </button>

        <button type="button" class="quick-btn {% if request.GET.range == 'yesterday' %}active{% endif %}" data-range="yesterday">
            Yesterday
        </button>

        <button type="button" class="quick-btn {% if request.GET.range == 'week' %}active{% endif %}" data-range="week">
            Last 7 Days
        </button>

        <button type="button" class="quick-btn {% if request.GET.range == 'month' %}active{% endif %}" data-range="month">
            This Month
        </button>

        <button type="button" class="quick-btn {% if request.GET.range == 'last_month' %}active{% endif %}" data-range="last_month">
            Last Month
        </button>

        <button type="button" class="quick-btn {% if request.GET.range == 'year' %}active{% endif %}" data-range="year">
            This Year
        </button>

        <button type="button" class="quick-btn {% if request.GET.range == 'all' %}active{% endif %}" data-range="all">
            All
        </button>

    </div>

    <div class="filter-group">

        <input
            type="date"
            name="from_date"
            value="{{ request.GET.from_date }}"
            class="report-control">

        <input
            type="date"
            name="to_date"
            value="{{ request.GET.to_date }}"
            class="report-control">

        <input
            type="text"
            name="search"
            value="{{ request.GET.search }}"
            placeholder="{{ search_placeholder|default:'Search...' }}"
            class="report-control">

        <button type="submit" class="btn btn-primary">
            Apply
        </button>

        <a href="{% url reset_url %}"
           class="btn btn-secondary">
            Reset
        </a>

    </div>

</form>

</div>
