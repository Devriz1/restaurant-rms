{% if messages %}
<div class="px-4 pt-2 pb-1" style="max-width: 650px; margin: 0 auto;">
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show d-flex align-items-center gap-2 border-0 shadow-sm rounded-pill py-2 px-3 mb-2 small" role="alert">
            <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% elif message.tags == 'error' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %}"></i>
            <div class="fw-medium">{{ message }}</div>
            <button type="button" class="btn-close ms-auto p-2" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.75rem;"></button>
        </div>
    {% endfor %}
</div>
{% endif %}
