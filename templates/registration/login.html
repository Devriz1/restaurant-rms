{% extends "auth_base.html" %}
{% load widget_tweaks %}

{% block title %}Sign In | Restaurant RMS{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">
            <i class="bi bi-shop-window"></i>
        </div>

        <h2>Restaurant RMS</h2>

        <p>Enter your credentials to access the system</p>

        <form
    method="post"
    autocomplete="off"
    spellcheck="false">

    {% csrf_token %}

    <div class="mb-3">

        <label class="form-label">

            <i class="bi bi-person me-1 text-primary"></i>

            Username

        </label>

        <input
            type="text"
            name="username"
            class="form-control"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false">

    </div>

    <div class="mb-4">

        <label class="form-label">

            <i class="bi bi-key me-1 text-primary"></i>

            Password

        </label>

        <input
            type="password"
            name="password"
            class="form-control"
            autocomplete="new-password">

    </div>

    <button
        type="submit"
        class="btn btn-primary w-100 shadow-sm">

        <i class="bi bi-box-arrow-in-right me-1"></i>

        Sign In to RMS

    </button>

</form>
        <div class="version">
            Restaurant RMS &bull; v2.0 Enterprise
        </div>

    </div>

</div>

{% endblock %}
